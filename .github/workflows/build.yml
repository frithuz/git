name: Build and release Git

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate release identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          metadata=$(bash scripts/metadata.sh)
          tag=$(awk -F= '$1 == "tag" { print $2 }' <<<"$metadata")
          if [[ $REF_TYPE == tag && $REF_NAME != "$tag" ]]; then
            echo "Release tag must be $tag" >&2
            exit 1
          fi
      - name: Build all outputs and run verification
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-bake.hcl
          targets: |
            default
            source-test
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.cache-from=type=gha,scope=git-${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=git-${{ matrix.arch }}
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Upload packages, image, and corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release and signed APT repository
    environment: apt
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: git-*
          path: dist/builds
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install repository and image publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils curl jq skopeo
      - name: Collect artifacts and sign the APT repository
        env:
          APT_SIGNING_KEY: ${{ vars.SIGNING_KEY }}
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
          OPENBAO_AUTH_PATH: ${{ vars.OPENBAO_AUTH_PATH }}
          OPENBAO_ROLE: ${{ vars.OPENBAO_ROLE }}
          OPENBAO_SECRET_PATH: ${{ vars.OPENBAO_SECRET_PATH }}
          OPENBAO_AUDIENCE: ${{ vars.OPENBAO_AUDIENCE }}
        run: |
          bash scripts/collect-release.sh
          bash scripts/apt/ci.sh
          cp dist/packages/*.deb dist/release/
          cp dist/apt/key.asc dist/release/
          tar -czf dist/release/apt-repository.tar.gz -C dist/apt .
          cd dist/release
          sha256sum ./* >SHA256SUMS
      - name: Publish verified images and release files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/release.sh
